# Personal academic website for Junteng Liu.
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "First-year PhD candidate at HKUST NLP Group. Research in natural language processing and machine learning."
url: "https://spallaselvylt93422.github.io"
baseurl: "/LJT-Homepage"
repository: "spallaselvylt93422/LJT-Homepage"

author:
  avatar:
  name: *name
  pronouns:
  bio: "First-year PhD candidate at HKUST NLP Group. Research in natural language processing and machine learning."
  location:
  employer: "HKUST NLP Group"
  uri:
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Only the About and Publications pages are published.
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: true
  path:

google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

twitter:
  username: &twitter "junteng88716710"
og_image:
og_description: *description
social:
  type: "Person"
  name: *name
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"
analytics:
  provider: "false"
  google:
    tracking_id:

include:
  - .htaccess
  - _pages
exclude:
  - .devcontainer
  - .github
  - AGENTS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - _drafts
  - _posts
  - _publications
  - _portfolio
  - _talks
  - _teaching
  - docker-compose.yaml
  - _config_docker.yml
  - files
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - package.json
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections: {}
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
      related: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
